'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Image gallery
status: stable
description: 'Figma brand "Gallery": rows of 3:2 landscape and 4:5 portrait photographs in a repeating pattern on desktop; a swipe gallery with arrows on mobile.'
libraryOverrides:
  css:
    component:
      image_gallery.scss: {}
  js:
    image_gallery.js: {}
  dependencies:
    - core/drupal
    - core/once
    - core/components.pimlico--button_icon
props:
  type: object
  properties:
    heading:
      type: string
      title: Heading
    caption:
      type: string
      title: Caption
      description: 'Credit shown opposite the heading, e.g. "Photography: …".'
    images:
      type: array
      title: Images
      description: 'Rendered images, in order.'
