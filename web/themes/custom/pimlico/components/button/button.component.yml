'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Button
status: stable
description: 'Figma "A / Button" (3:1967). Yellow is the default and the style every site button uses; Dark is in the design system but unused.'
libraryOverrides:
  css:
    component:
      button.scss: {}
props:
  type: object
  properties:
    text:
      type: string
      title: Text
      examples:
        - 'Discover every brand'
    url:
      type: string
      title: Url
      description: 'Renders a link when set, otherwise a button.'
    variant:
      type: string
      title: Variant
      enum:
        - yellow
        - dark
      default: yellow
    external:
      type: boolean
      title: Opens in a new tab
      description: 'For a link to another site: opens it in a new tab and tells screen readers so with visually hidden text.'
    full_width:
      type: boolean
      title: Full width
      description: 'Stretch to the container, as on mobile.'
    class:
      type: string
      title: Class
