'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Mega menu
status: stable
description: 'Figma "Mega menu": full-width panel below the header with primary links, a secondary list and a feature card.'
libraryOverrides:
  css:
    component:
      mega_menu.scss: {}
props:
  type: object
  required:
    - id
  properties:
    id:
      type: string
      title: Panel ID
      description: 'Referenced by the toggle button aria-controls.'
    eyebrow:
      type: string
      title: Eyebrow
    links:
      title: Primary links
      description: 'Child menu items.'
      type: array
    rows:
      title: Advanced Mega Menu rows
      description: 'Render array of extra columns (secondary list, feature card).'
      type: ['array', 'object', 'null']
slots:
  content:
    title: Extra columns
    description: 'Used by Storybook. Drupal passes rows instead.'
