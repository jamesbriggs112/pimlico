'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Story intro
status: stable
description: 'Figma article "Section · Introduction": a centred pumpkin meta line (category · date · author · reading time) over the wide lead image and caption.'
libraryOverrides:
