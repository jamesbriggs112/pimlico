'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Rich text
status: stable
description: 'Figma "Rich text": long-form body at a 760px measure. Styles headings, paragraphs, lists and links from the editor.'
libraryOverrides:
  css:
    component:
      rich_text.scss: {}
props:
  type: object
  properties:
    heading:
      type: string
      title: Heading
    align:
      type: string
      title: Alignment
      enum: [start, center]
      default: center
      description: 'center = the 760px column centred in the page; start = left-aligned (inside other layouts).'
slots:
  content:
    title: Content
