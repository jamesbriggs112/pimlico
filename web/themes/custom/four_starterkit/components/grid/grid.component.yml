'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Grid
status: stable
libraryOverrides:
  css:
    component:
      grid.scss: {}
props:
  type: object
  required:
    - columns
  properties:
    columns:
      type: integer
      title: Columns
      enum:
        - 2
        - 3
        - 4
    class:
      type: string
      title: Additional CSS classes
slots:
  content:
    title: Content
