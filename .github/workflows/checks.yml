name: Checks

on:
  pull_request:
    branches:
      - dev
      - staging
      - main

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: gd, pdo_sqlite, intl, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Coding standards
        run: vendor/bin/phpcs

      - name: Tests
        run: |
          if compgen -G "web/modules/custom/*/tests/src" > /dev/null || compgen -G "web/themes/custom/*/tests/src" > /dev/null; then
            vendor/bin/phpunit --testsuite custom
          else
            echo "No custom tests yet."
          fi
