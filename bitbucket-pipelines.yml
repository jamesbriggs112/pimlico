image: atlassian/default-image:4

definitions:
  caches:
    pnpm: $BITBUCKET_CLONE_DIR/.pnpm-store
    node: web/themes/custom/$THEME_NAME/node_modules
  steps:
    - step: &buildBaseTheme
        name: 'Build Base Theme'
        image: node:20
        caches:
          - node
        script:
          - cd web/themes/custom/$THEME_NAME
          - corepack enable
          - corepack prepare pnpm@latest-10 --activate
          - pnpm i --frozen-lockfile
          - pnpm run build
        artifacts:
          - web/**
    - step: &deploy
        name: 'Build Package'
        script:
          - echo "Building package"
          - sed -i "s/cloudfront_placeholder/$AWS_DISTRIBUTION_ID/g" .ebextensions/sentry.config
          - sed -i "s/release_placeholder/$BITBUCKET_COMMIT/g" .ebextensions/sentry.config
          - sed -i "s/environment_placeholder/$SENTRY_ENVIRONMENT/g" .ebextensions/sentry.config
          - sed -i "s#dsn_placeholder#$SENTRY_DSN#g" .ebextensions/sentry.config
          - zip -r application.zip web composer.json composer.lock .ebextensions .platform scaffold config --exclude='web/themes/custom/$THEME_NAME/node_modules/*'
          - export BITBUCKET_COMMIT_SHORT=$(echo $BITBUCKET_COMMIT | cut -c1-7)
          - pipe: atlassian/aws-elasticbeanstalk-deploy:1.4.1
            variables:
              AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
              AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
              AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
              APPLICATION_NAME: $APPLICATION_NAME
              ZIP_FILE: 'application.zip'
              S3_BUCKET: $S3_BUCKET
              VERSION_LABEL: 'build-$BITBUCKET_BUILD_NUMBER-commit-$BITBUCKET_COMMIT_SHORT'
              ENVIRONMENT_NAME: $ENVIRONMENT_NAME
              WAIT: 'true'
    - step: &sentry
        name: 'Sentry Release'
        script:
          - pipe: sentryio/sentry-new-release:0.3.0
            variables:
              SENTRY_AUTH_TOKEN: $SENTRY_AUTH_TOKEN
              SENTRY_ORG: $SENTRY_ORG
              SENTRY_PROJECT: $SENTRY_PROJECT
              ENVIRONMENT: $SENTRY_ENVIRONMENT
    - step: &invalidate
        name: 'Invalidate Cache'
        script:
          - pipe: atlassian/aws-cloudfront-invalidate:0.10.1
            variables:
              AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
              AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
              AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
              DISTRIBUTION_ID: $AWS_DISTRIBUTION_ID

pipelines:
  branches:
    staging:
      - stage:
          deployment: staging
          steps:
            - step: *buildBaseTheme
            - step: *deploy
            - step: *sentry
            - step: *invalidate
    main:
      - stage:
          deployment: production
          steps:
            - step: *buildBaseTheme
            - step: *deploy
            - step: *sentry
            - step: *invalidate
