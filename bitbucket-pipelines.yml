image: atlassian/default-image:4

definitions:
  caches:
    yarn: /root/.yarn/berry
  steps:
    - step: &buildBaseTheme
        name: "Build Base Theme"
        image: node:20
        caches:
          - node
        script:
          - cd web/themes/custom/four_starterkit
          - corepack enable
          - yarn set version stable
          - yarn install --immutable
          - yarn build
        artifacts:
          - web/**
    - step: &package
        name: "Build Package"
        script:
          - echo "Building package"
          - zip -r application.zip web composer.json composer.lock .ebextensions .platform scaffold config --exclude='web/themes/custom/four_starterkit/node_modules/*'
          - export BITBUCKET_COMMIT_SHORT=$(echo $BITBUCKET_COMMIT | cut -c1-7)
          - pipe: atlassian/aws-elasticbeanstalk-deploy:1.4.0
            variables:
              AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
              AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
              AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
              APPLICATION_NAME: $APPLICATION_NAME
              COMMAND: "upload-only"
              ZIP_FILE: "application.zip"
              S3_BUCKET: $S3_BUCKET
              VERSION_LABEL: "build-$BITBUCKET_BUILD_NUMBER-commit-$BITBUCKET_COMMIT_SHORT"
    - step: &deploy
        name: "Deploy"
        script:
          - export BITBUCKET_COMMIT_SHORT=$(echo $BITBUCKET_COMMIT | cut -c1-7)
          - pipe: atlassian/aws-elasticbeanstalk-deploy:1.4.0
            variables:
              AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
              AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
              AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
              APPLICATION_NAME: $APPLICATION_NAME
              COMMAND: "deploy-only"
              VERSION_LABEL: "build-$BITBUCKET_BUILD_NUMBER-commit-$BITBUCKET_COMMIT_SHORT"
              ENVIRONMENT_NAME: $ENVIRONMENT_NAME
              WAIT: "true"
    - step: &invalidate
        name: "Invalidate Mayfair Cache"
        script:
          - pipe: atlassian/aws-cloudfront-invalidate:0.6.0
            variables:
              AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
              AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
              AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
              DISTRIBUTION_ID: $AWS_DISTRIBUTION_ID

pipelines:
  branches:
    staging:
      - stage:
          deployment: staging
          steps:
            - step: *buildBaseTheme
            - step: *package
            - step: *deploy
            - step: *invalidate
    main:
      - stage:
          deployment: production
          steps:
            - step: *buildBaseTheme
            - step: *package
            - step: *deploy
            - step: *invalidate
